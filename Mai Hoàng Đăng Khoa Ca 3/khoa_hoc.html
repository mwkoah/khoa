<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng ký Khóa Học</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Đăng Kí Khoá học</h1>
  <div class="container">
    <section class="form-section">
      <form>
        <h2>Form Đăng Ký</h2>

        <label for="name">Họ và tên</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        
        <label>Giới tính</label>
        <div class="gender-options">
          <label><input type="radio" name="gender" value="Nam" required> Nam</label>
          <label><input type="radio" name="gender" value="Nữ"> Nữ</label>
          <label><input type="radio" name="gender" value="Khác"> Khác</label>
        </div>

        <label for="course">Khóa học</label>
        <select id="course" name="course">
          <option value="">-- Chọn --</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="js">JavaScript</option>
        </select>

        <label for="note">Ghi chú</label>
        <textarea id="note" rows="4"></textarea>

        <button type="submit" class="submit-btn">Gửi</button>
      </form>
    </section>

    <section class="table-section">
      <h2>Danh Sách Khóa Học</h2>
      <table>
        <thead>
          <tr>
            <th>Tên khóa học</th>
            <th>Thời lượng</th>
            <th>Học phí</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>HTML Cơ Bản</td>
            <td>8 tuần</td>
            <td>Miễn phí</td>
          </tr>
          <tr>
            <td>CSS Nâng Cao</td>
            <td>10 tuần</td>
            <td>500.000đ</td>
          </tr>
          <tr>
            <td>JavaScript từ zero đến hero</td>
            <td>12 tuần</td>
            <td>8000.000đ</td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>
  <div class="video-section">
    <h2>Video Giới Thiệu</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/AFPZanrJo8o?si=pB3YRQQTOrcKce0m" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></iframe>
  </div>
  </div>
  <div class="Thông tin chi tiết"
    <h2> 2025 Mai Hoàng Đăng Khoa-TD01221. All rights reseverd</h2>

  </div>
</body>
</html>
